services:
  - type: web
    name: nook-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: TINYFISH_API_KEY
        sync: false          # set manually in Render dashboard
      - key: LLM_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: DEMO_MODE
        value: "false"
      - key: DISCOVERY_FALLBACK_URLS
        value: ""
      - key: TINYFISH_TIMEOUT
        value: "120"
      - key: TINYFISH_MAX_CONCURRENT
        value: "3"
      - key: LLM_TIMEOUT
        value: "30"
